name: MCLA
options:
  bundleIdPrefix: com.shonufdonut
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "2"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  MCLA:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      # MoltenVK and the SDK (built by CMake into probe-lib/, see ios/probe/).
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
      - sdk: IOSurface.framework
      - sdk: CoreGraphics.framework
      - sdk: UIKit.framework
      - sdk: Foundation.framework
      - sdk: MetalFX.framework
      # SDL3 (pulled in by the SDK UI library)
      - sdk: AVFoundation.framework
      - sdk: AudioToolbox.framework
      - sdk: CoreAudio.framework
      - sdk: CoreBluetooth.framework
      - sdk: CoreHaptics.framework
      - sdk: CoreMotion.framework
      - sdk: GameController.framework
    settings:
      base:
        SWIFT_OBJC_BRIDGING_HEADER: probe/mcla_probe.h
        LIBRARY_SEARCH_PATHS: $(PROJECT_DIR)/probe-lib
        # -ObjC keeps MoltenVK's Objective-C categories (e.g. setBorderColorMVK:), which the linker
        # otherwise drops from a static library because nothing references them by symbol.
        OTHER_LDFLAGS: -ObjC -lmcla_probe_all -lc++
        DEAD_CODE_STRIPPING: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.shonufdonut.mcla
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        ENABLE_BITCODE: NO
